name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # HACS and hassfest recommend a daily run, to catch new Home Assistant rules
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: format --check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mypy
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The driver tests stub the BLE libraries (tests/_harness.py), so the
      # standard library and coverage are all they need.
      - run: pip install coverage
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The integration runs inside a real Home Assistant (tests_ha).
      - run: >
          pip install pytest-homeassistant-custom-component bleak-retry-connector
          aiousbwatcher bluetooth-adapters bluetooth-auto-recovery
          bluetooth-data-tools dbus-fast habluetooth pyserial pyudev
      # The two suites cover different halves (the drivers, and the entities
      # and flows); the integration has to be covered at 95 % by both.
      - run: pip install coverage
      - run: coverage run -m unittest discover -s tests
      - run: coverage run --append -m pytest tests_ha
      - run: coverage report --fail-under=95
