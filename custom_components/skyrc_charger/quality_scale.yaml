# Self-assessment against the Home Assistant integration quality scale.
# A custom integration is not graded by Home Assistant; this file records
# where it stands, honestly, rule by rule.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities are updated by the coordinator; none subscribes to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: todo
    comment: A rediscovered charger does not update the stored address.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One entry is one charger; slots are fixed by the model.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: todo
    comment: Exceptions raised to the user are plain English strings.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: A refused passcode is handled by the reauthentication flow.
  stale-devices:
    status: exempt
    comment: A charger has a single device, removed with its entry.
  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration does not use HTTP.
  strict-typing:
    status: todo
    comment: mypy passes on the integration, but it is not run in strict mode.
