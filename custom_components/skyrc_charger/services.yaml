refresh:
  fields:
    entry_id: &entry_id
      required: false
      selector:
        config_entry:
          integration: skyrc_charger

start_slot:
  fields:
    entry_id: *entry_id
    slot: &slot
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    chemistry: &chemistry
      required: false
      selector:
        select:
          translation_key: chemistry
          options:
            - liion
            - liion_hv
            - lifepo4
            - nimh
            - nicd
            - eneloop
            - nizn
            - ram
            - lto
            - naion
    mode: &mode
      required: false
      selector:
        select:
          translation_key: mode
          options:
            - charge
            - storage
            - discharge
            - cycle
            - refresh
            - break_in
    current_ma: &current_ma
      required: false
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: mA
          mode: box
    capacity_mah: &capacity_mah
      required: false
      selector:
        number:
          min: 100
          max: 20000
          unit_of_measurement: mAh
          mode: box

stop_slot:
  fields:
    entry_id: *entry_id
    slot: *slot

start_all:
  fields:
    entry_id: *entry_id
    chemistry: *chemistry
    mode: *mode
    current_ma: *current_ma
    capacity_mah: *capacity_mah

stop_all:
  fields:
    entry_id: *entry_id

fetch_voltage_curve:
  fields:
    entry_id: *entry_id
    slot: *slot
